<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenosoft — Subscribe</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #171717;
    color: #eeeeee;
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    height: 76px;
    background: #303030;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    box-shadow: 0 4px 15px rgba(0,0,0,.6);
}

.logo {
    font-size: 25px;
    font-weight: 300;
    letter-spacing: 1px;
    color: #fff;
}

.logo span {
    font-weight: 600;
}

nav {
    display: flex;
    align-items: center;
    gap: 38px;
}

nav a {
    color: #c7c7c7;
    text-decoration: none;
    font-size: 14px;
    transition: color .2s;
}

nav a:hover,
nav a.active {
    color: white;
}

nav a.active {
    border-bottom: 2px solid #fff;
    padding-bottom: 7px;
}

main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 25px;
    flex: 1;
}

/* Hero Section */
.hero {
    text-align: center;
    padding: 80px 20px 50px;
}

h1 {
    font-size: 48px;
    font-weight: 200;
    margin-bottom: 24px;
    color: #fff;
}

.btn-green {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #28a745;
    color: #fff;
    padding: 14px 28px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    border-radius: 0; /* Removido arredondado */
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    transition: background .2s, transform .1s;
}

.btn-green:hover {
    background: #218838;
    transform: translateY(-2px);
}

.btn-green svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
}

/* Products Preview */
.products-preview {
    text-align: center;
    margin: 40px 0 80px;
}

.products-preview img {
    max-width: 100%;
    height: auto;
    border-radius: 0; /* Removido arredondado */
    box-shadow: none;
    margin-bottom: 40px;
    border: none;
}

.products-preview h2 {
    font-size: 32px;
    font-weight: 300;
    margin-bottom: 16px;
}

.products-preview p {
    color: #aaa;
    font-size: 18px;
    max-width: 650px;
    margin: 0 auto 30px;
    line-height: 1.6;
}

/* Features Grid */
.features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 25px;
    margin-bottom: 80px;
}

.feature-card {
    background: #303030;
    padding: 30px;
    border-radius: 0; /* Removido arredondado */
    box-shadow: 0 8px 25px rgba(0,0,0,.5);
    border: 1px solid #444;
}

.feature-card h3 {
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 12px;
    color: #fff;
}

.feature-card p {
    color: #b0b0b0;
    font-size: 14px;
    line-height: 1.5;
}

/* FAQ Section */
.faq-section {
    background: #222;
    padding: 50px 34px;
    border-radius: 0; /* Removido arredondado */
    box-shadow: 0 10px 30px rgba(0,0,0,.6);
    margin-bottom: 80px;
    border: 1px solid #383838;
}

.faq-section h2 {
    font-size: 28px;
    font-weight: 200;
    margin-bottom: 30px;
    text-align: center;
}

.faq-item {
    margin-bottom: 24px;
    border-bottom: 1px solid #333;
    padding-bottom: 20px;
}

.faq-item:last-child {
    margin-bottom: 0;
    border-bottom: none;
    padding-bottom: 0;
}

.faq-question {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 8px;
}

.faq-answer {
    font-size: 14px;
    color: #aaa;
    line-height: 1.6;
}

footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    padding: 30px;
    background: #111;
    margin-top: auto;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.5);
}

footer nav {
    justify-content: center;
    gap: 20px;
    margin-bottom: 15px;
}

footer nav a {
    color: #777;
    font-size: 12px;
}

footer nav a:hover {
    color: #bbb;
}

@media (max-width: 750px) {
    header {
        padding: 0 20px;
    }

    nav {
        gap: 15px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .products-preview h2 {
        font-size: 24px;
    }

    .faq-section {
        padding: 30px 20px;
    }
}
  .card.featured {
    border-top: 3px solid #d5d5d5;
    flex: 1.35;
}

  .card h3 {
    background-color: #FFD700;
    padding: 10px;
  }

</style>
</head>

<body>

<header>
    <div class="logo"><span>XENO</span>SOFT</div>

    <nav>
        <a href="#" class="active">Home</a>
        <a href="pricing.html">Pricing</a>
        <a href="shop.html">Products</a>
        <a href="#">Login</a>
    </nav>
</header>

<main>
    <h1>Subscribe on our plan</h1>
  <article class="card featured">
            <h1>UserPacn 2019</h1>

            <div class="price">
                US$29<small>/mo</small>
            </div>
            <h3>Your plan</h2>
        </article>

  <h2>How you prefer paying?</h2>
  <button class="btn-green" href="get_vero2019.html">NICTFastPay</button>
  <button class="btn-green" href="#">Xenosoft Pay</button>
</main>
<footer>
    <nav>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Contact Us</a>
        <a href="#">Support</a>
    </nav>
    <p>© 2019 Xenosoft Corporation. All rights reserved.</p>
</footer>

</body>
</html>
